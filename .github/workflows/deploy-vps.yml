name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy; leave blank to deploy the selected main revision.
        required: false
        type: string

concurrency:
  group: deploy-vps-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Resolve commit SHA
        id: revision
        env:
          EVENT_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          revision="${INPUT_SHA:-$EVENT_SHA}"
          if ! [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The deployment revision must be a 40-character commit SHA." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Trigger VPS deployment
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set the VPS_HOST repository secret.}"
          : "${VPS_USER:?Set the VPS_USER repository secret.}"

          port="${VPS_SSH_PORT:-22}"
          app_dir="${VPS_APP_DIR:-/home/$VPS_USER/iiqe-app}"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash '$app_dir/scripts/deploy-pm2-from-git.sh' '$DEPLOY_SHA'"
