name: iiqe-app

services:
  # ============================================================
  # 主應用:Next.js + Prisma + SQLite
  # 宿主 nginx 反代到 127.0.0.1:3001,容器本身不對公網暴露
  # 宿主 3000 可能已被其他服務佔用,這裡改用 3001;nginx 站點也指向 3001
  # ============================================================
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 與宿主 ecs-user 對齊;若 id 命令輸出不是 1000,
        # 在 .env.production 用 UID/GID 環境變量覆蓋
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: iiqe-app:latest
    container_name: iiqe-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # DATABASE_URL 在 .env.production 中設置,覆寫一下確保指向 volume
      DATABASE_URL: file:/data/prod.db
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - iiqe-data:/data
    # 僅綁定宿主 loopback,避免公網直連;nginx 反代會從 127.0.0.1 訪問
    # 宿主端口選擇:避開已被佔用的 3000
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/papers',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ============================================================
  # 一次性遷移容器(僅首次部署或 schema 變更時手動觸發)
  # 用法:docker compose --profile init run --rm migrate
  # ============================================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: iiqe-app:latest
    container_name: iiqe-migrate
    profiles: ["init"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/data/prod.db
    volumes:
      - iiqe-data:/data
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

volumes:
  iiqe-data:
    # SQLite 數據庫持久化;首次啟動後請勿隨意刪除