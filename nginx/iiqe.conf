# ============================================================
# IIQE App — 宿主 nginx 站點配置 (conf.d 風格)
# 部署路徑:/etc/nginx/conf.d/iiqe.conf
# 生效:nginx -t && systemctl reload nginx
#
# HTTPS 段由 `sudo certbot --nginx` 自動生成,本文件只配 HTTP 反代。
# certbot 會:
#   - 申請並配置 Let's Encrypt 證書
#   - 加 301 HTTPS 跳轉
#   - 修改 listen 443 ssl / ssl_certificate 等指令
#
# 部署前請把 server_name 改為真實域名。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;    # ← 改成你的域名

    access_log /var/log/nginx/iiqe.access.log;
    error_log  /var/log/nginx/iiqe.error.log;

    # 客戶端請求體大小(Next.js API 預設 1mb,放大到 10mb 留餘量)
    client_max_body_size 10m;

    # 隱藏 server 頭
    server_tokens off;

    # 安全 Header（certbot --nginx 會保留到 HTTPS block）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS 僅在 HTTPS 生效,certbot 會自動寫入(此處保留註釋提醒)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js 靜態資源帶 hash,可長期緩存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
    }

    # favicon
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 主反代
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / HMR / Server-Sent Events
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超時(Next.js SSR 可能慢)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不緩存動態內容
        proxy_buffering off;
        proxy_cache off;
    }
}