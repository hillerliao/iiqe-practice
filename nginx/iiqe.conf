# ============================================================
# IIQE App 站點配置 — 適用於 nginx + conf.d 風格
# 部署路徑:/etc/nginx/conf.d/iiqe.conf
# 生效:nginx -t && nginx -s reload   (或 systemctl reload nginx)
#
# 此配置包含兩個 server 塊:
#   - 80 端口:僅服務 /.well-known/acme-challenge/ (certbot webroot 用)
#     其他 HTTP 請求 301 跳轉到 HTTPS
#   - 443 反代到 127.0.0.1:3000 (next-app 容器)
#
# 部署前請把 server_name 和 ssl_certificate 路徑裡的
# your-domain.example.com 全部替換為你的真實域名
# ============================================================

# HTTP(80):僅服務 ACME 驗證 + 全局跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;    # ← 改成你的域名

    # certbot webroot 驗證路徑
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 其餘請求 301 跳轉到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443):反代到 next-app 容器
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example.com;    # ← 改成你的域名

    # Let's Encrypt 證書(由 certbot 申請後自動生成)
    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;   # ← 改成你的域名
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;     # ← 改成你的域名

    # SSL 配置(Let's Encrypt 推薦)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全 Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 日誌
    access_log /var/log/nginx/iiqe.access.log;
    error_log  /var/log/nginx/iiqe.error.log;

    # 客戶端請求體大小
    client_max_body_size 10m;

    # 隱藏 server 頭
    server_tokens off;

    # 靜態資源緩存(Next.js 產物帶 hash)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
    }

    # favicon
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 主反代
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / HMR / Server-Sent Events
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超時(Next.js SSR 可能慢)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不緩存動態內容
        proxy_buffering off;
        proxy_cache off;
    }
}